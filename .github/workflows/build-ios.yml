name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 双保险：删掉 pubspec.yaml 里非法的 flutter.config
      - name: Fix invalid pubspec config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pubspec.yaml")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
          out = []
          skip = False
          for line in lines:
              s = line.rstrip("\n")
              if s == "  config:":
                  skip = True
                  continue
              if skip:
                  if s.startswith("    ") or s.strip() == "":
                      continue
                  skip = False
              out.append(line)
          text = "".join(out)
          p.write_text(text, encoding="utf-8")
          if "enable-swift-package-manager" in text or "\n  config:" in text:
              raise SystemExit("ERROR: config still present in pubspec.yaml")
          print("pubspec.yaml cleaned OK")
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true

      - name: Show Flutter/Dart version
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # 关闭代码签名，避免 Development Team 报错
      - name: Disable code signing
        run: |
          # Release.xcconfig
          cat >> ios/Flutter/Release.xcconfig <<'EOF'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=
          DEVELOPMENT_TEAM=
          EOF

          # 顺手改一下 project.pbxproj 里的签名相关设置
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=

      - name: Pack IPA
        run: |
          APP_PATH=""
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/iphoneos/Runner.app"
          elif [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/Release-iphoneos/Runner.app"
          else
            echo "Runner.app not found"
            find build/ios -name "Runner.app" -type d || true
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r selene-unsigned.ipa Payload
          ls -lh selene-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: selene-ios-ipa
          path: selene-unsigned.ipa
          retention-days: 14
