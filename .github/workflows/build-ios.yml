name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 双保险：删掉 pubspec.yaml 里非法的 flutter.config
      - name: Fix invalid pubspec config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pubspec.yaml")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
          out = []
          skip = False
          for line in lines:
              s = line.rstrip("\n")
              if s == "  config:":
                  skip = True
                  continue
              if skip:
                  if s.startswith("    ") or s.strip() == "":
                      continue
                  skip = False
              out.append(line)
          text = "".join(out)
          p.write_text(text, encoding="utf-8")
          if "enable-swift-package-manager" in text or "\n  config:" in text:
              raise SystemExit("ERROR: config still present in pubspec.yaml")
          print("pubspec.yaml cleaned OK")
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true

      - name: Show Flutter/Dart version
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # 关闭代码签名，避免 Development Team 报错
      - name: Prepare iOS project
        run: |
          # 只生成配置，不真正编译（避免 Flutter 再检查 Team）
          flutter build ios --release --no-codesign --config-only

          # 强制写入无签名配置
          for f in ios/Flutter/Release.xcconfig ios/Flutter/Generated.xcconfig; do
            if [ -f "$f" ]; then
              printf '\nCODE_SIGNING_ALLOWED=NO\nCODE_SIGNING_REQUIRED=NO\nCODE_SIGN_IDENTITY=\nDEVELOPMENT_TEAM=\n' >> "$f"
            fi
          done

          # 改 Xcode 工程签名设置
          sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' \
            ios/Runner.xcodeproj/project.pbxproj || true

      - name: Xcode build (unsigned)
        run: |
          set -e
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Pack IPA
        run: |
          set -e
          APP=$(find build/ios_derived -name 'Runner.app' -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "Runner.app not found"
            find build -name '*.app' -type d || true
            exit 1
          fi
          echo "Using: $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry selene-unsigned.ipa Payload
          ls -lh selene-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: selene-ios-ipa
          path: selene-unsigned.ipa
          retention-days: 14
