name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 双保险：构建前删掉非法的 flutter.config
      - name: Fix invalid pubspec config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pubspec.yaml")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
          out = []
          skip = False
          for line in lines:
              s = line.rstrip("\n")
              if s == "  config:":
                  skip = True
                  continue
              if skip:
                  if s.startswith("    ") or s.strip() == "":
                      continue
                  skip = False
              out.append(line)
          text = "".join(out)
          p.write_text(text, encoding="utf-8")
          if "enable-swift-package-manager" in text or "\n  config:" in text:
              raise SystemExit("ERROR: config still present")
          print("pubspec.yaml cleaned OK")
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 需要 Dart >= 3.8（dlna_dart 要求），Flutter 3.32+ 才带 Dart 3.8
          flutter-version: "3.32.8"
          channel: "stable"
          cache: true

      - name: Show Flutter/Dart version
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Pack IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r selene-unsigned.ipa Payload
          ls -lh selene-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: selene-ios-ipa
          path: selene-unsigned.ipa
          retention-days: 14
